name: gates

on:
  push:
  pull_request:

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python gate0_symmetry_receipt.py
      - run: python gate1_six_region_localization.py
      - run: python gate2_greedy_planner.py
